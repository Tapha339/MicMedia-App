<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>MicMedia</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#08090d;--card:#11131a;--card2:#171923;--text:#fff;--muted:#9296a5;--line:#252834;--accent:#8b5cf6}
body{font-family:Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
button{border:0;color:white;cursor:pointer;font-family:inherit}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ENTER */
#entrySurface{position:fixed;inset:0;z-index:99999;background:radial-gradient(circle at 50% 35%,#24184d 0%,#11101d 35%,#08090d 75%);display:flex;align-items:center;justify-content:center;padding:25px}
.entryBox{width:100%;max-width:390px;text-align:center}
.entryLogo{width:105px;height:105px;margin:0 auto 25px;border-radius:29px;background:linear-gradient(135deg,#ff4ecd,#7c3aed,#18c8ff);display:flex;align-items:center;justify-content:center;box-shadow:0 20px 60px rgba(124,58,237,.35)}
.entryLogo span{font-size:65px;font-weight:900;font-style:italic;color:white}
.entryTitle{font-size:36px;font-weight:800;letter-spacing:-1.5px;margin-bottom:10px}
.entryText{color:#a5a8b6;font-size:15px;line-height:1.5;margin-bottom:32px}
.enterBtn{width:100%;height:58px;border-radius:18px;background:linear-gradient(135deg,#8b5cf6,#ec4899);font-size:17px;font-weight:800}
.enterBtn:active{transform:scale(.97)}

/* APP */
#app{display:none;min-height:100vh;padding-bottom:90px}
.topbar{height:66px;position:sticky;top:0;z-index:1000;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:rgba(8,9,13,.92);backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.05)}
.brand{display:flex;align-items:center;gap:10px}
.brandLogo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#ff4ecd,#7c3aed,#18c8ff);display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:900;font-style:italic}
.brandName{font-size:20px;font-weight:800}
.topActions{display:flex;gap:9px}
.iconBtn{width:40px;height:40px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center}
.iconBtn svg{width:20px;height:20px}
.backBtn{display:none}

/* CONTENT */
.page{display:none;padding:16px;animation:pageIn .18s ease}
.page.active{display:block}
@keyframes pageIn{from{opacity:.3;transform:translateX(8px)}to{opacity:1;transform:translateX(0)}}
.sectionTitle{font-size:25px;font-weight:800;margin:8px 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;margin-bottom:16px}

/* STORIES */
.stories{display:flex;gap:14px;overflow-x:auto;padding:8px 2px 18px}
.stories::-webkit-scrollbar{display:none}
.story{min-width:72px;text-align:center}
.storyAvatar{width:66px;height:66px;border-radius:50%;padding:3px;background:linear-gradient(135deg,#ff4ecd,#8b5cf6,#18c8ff);margin:auto;position:relative}
.storyAvatar.live{background:linear-gradient(135deg,#ff304f,#ff0055,#ff7a00)}
.avatarInner{width:100%;height:100%;border-radius:50%;background:#252735;display:flex;align-items:center;justify-content:center;font-size:25px}
.storyName{font-size:11px;color:#aaaebb;margin-top:7px;white-space:nowrap}

/* POSTS */
.postHeader{padding:13px;display:flex;align-items:center;justify-content:space-between}
.userInfo{display:flex;align-items:center;gap:10px}
.avatar{width:43px;height:43px;border-radius:50%;background:linear-gradient(135deg,#8b5cf6,#ec4899);display:flex;align-items:center;justify-content:center;font-weight:800;position:relative}
.liveDot{position:absolute;bottom:-2px;right:-2px;background:#ff304f;border:3px solid var(--card);width:15px;height:15px;border-radius:50%}
.onlineDot{position:absolute;bottom:-1px;right:-1px;background:#28d66f;border:3px solid var(--card);width:15px;height:15px;border-radius:50%;box-shadow:0 0 0 2px rgba(40,214,111,.15)}
.username{font-weight:700;font-size:14px}
.handle{color:var(--muted);font-size:12px;margin-top:3px}
.followPlus{width:34px;height:34px;border-radius:50%;background:var(--card2);font-size:21px;color:#fff}
.followPlus.following{background:var(--accent);font-size:14px}
.postImage{height:310px;background:linear-gradient(135deg,#17122c,#321b56,#111827);display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:900}
.postBody{padding:14px}
.postText{font-size:14px;line-height:1.5;color:#ddd}

/* ACTIONS + COUNTERS */
.postActions{display:flex;align-items:center;gap:12px;padding:0 14px 14px;flex-wrap:wrap}
.actionBox{display:flex;align-items:center;gap:5px}
.action{background:none;width:27px;height:27px;display:flex;align-items:center;justify-content:center}
.action svg{width:22px;height:22px}
.actionCount{font-size:11px;color:var(--muted);white-space:nowrap}
.action.active{color:#ff3d68}
.action.saved{color:#a78bfa}
.action.shared{color:#5ee7a1}

/* LIVE */
.liveHero{padding:25px;border-radius:25px;background:linear-gradient(135deg,#21133c,#111827);margin-bottom:18px}
.liveLabel{display:inline-flex;align-items:center;gap:7px;background:#ff304f;padding:7px 11px;border-radius:10px;font-size:12px;font-weight:800;margin-bottom:16px}
.liveLabel span{width:7px;height:7px;border-radius:50%;background:white}
.liveHero h2{font-size:29px;margin-bottom:9px}
.liveHero p{color:#a4a8b7;line-height:1.5;font-size:14px}
.liveButton{margin-top:20px;padding:14px 20px;border-radius:14px;background:#ff304f;font-weight:800;display:inline-flex;align-items:center;gap:9px}
.liveButton svg{width:19px;height:19px}

/* LIVE STREAM LIST */
.liveSectionTitle{
font-size:16px;
font-weight:800;
margin:22px 0 12px;
}
.liveCreator{
background:var(--card);
border:1px solid var(--line);
border-radius:20px;
overflow:hidden;
margin-bottom:12px;
}
.liveCreatorPreview{
height:145px;
background:linear-gradient(135deg,#281044,#101827,#39111f);
display:flex;
align-items:center;
justify-content:center;
position:relative;
}
.liveCreatorPreview .playCircle{
width:52px;
height:52px;
border-radius:50%;
background:rgba(255,255,255,.14);
backdrop-filter:blur(10px);
display:flex;
align-items:center;
justify-content:center;
}
.liveCreatorPreview .playCircle svg{
width:22px;
fill:white;
}
.liveMiniBadge{
position:absolute;
top:10px;
left:10px;
background:#ff304f;
padding:5px 8px;
border-radius:7px;
font-size:9px;
font-weight:800;
}
.liveMiniViewers{
position:absolute;
top:10px;
right:10px;
background:rgba(0,0,0,.5);
padding:5px 8px;
border-radius:8px;
font-size:10px;
display:flex;
align-items:center;
gap:4px;
}
.liveCreatorInfo{
padding:12px;
display:flex;
align-items:center;
gap:10px;
}
.liveCreatorAvatar{
width:43px;
height:43px;
border-radius:50%;
background:linear-gradient(135deg,#8b5cf6,#ec4899);
display:flex;
align-items:center;
justify-content:center;
font-weight:800;
position:relative;
}
.liveCreatorDetails{flex:1}
.liveCreatorName{font-size:14px;font-weight:800}
.liveCreatorHandle{font-size:11px;color:var(--muted);margin-top:3px}
.joinLiveBtn{
padding:9px 13px;
border-radius:11px;
background:#ff304f;
font-size:11px;
font-weight:800;
}

/* REELS */
.reel{height:530px;border-radius:24px;overflow:hidden;position:relative;background:linear-gradient(145deg,#26104c,#081b2e,#29101e);margin-bottom:16px}
.reelContent{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.reelContent svg{width:68px;height:68px;stroke-width:1.7}
.reelBottom{position:absolute;left:16px;right:16px;bottom:20px;z-index:3}
.reelUser{display:flex;align-items:center;gap:10px}
.reelSide{position:absolute;right:13px;bottom:65px;display:flex;flex-direction:column;gap:7px}
.reelActionGroup{display:flex;flex-direction:column;align-items:center}
.reelAction{width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.45);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center}
.reelAction svg{width:22px;height:22px}
.reelCount{font-size:10px;font-weight:700;margin-top:2px;color:white}
.reelFollow{position:absolute;right:13px;top:18px;width:42px;height:42px;border-radius:50%;background:#fff;color:#111;display:flex;align-items:center;justify-content:center}
.reelFollow svg{width:22px;height:22px}
.reelFollow.following{background:var(--accent);color:white}

/* PROFILE */
.profileTop{text-align:center;padding:15px 0 25px}
.profileAvatar{width:92px;height:92px;border-radius:50%;margin:auto;background:linear-gradient(135deg,#ff4ecd,#8b5cf6,#18c8ff);padding:3px;position:relative}
.profileAvatarInner{width:100%;height:100%;border-radius:50%;background:#222532;display:flex;align-items:center;justify-content:center;font-size:34px}
.profileName{font-size:21px;font-weight:800;margin-top:12px}
.profileHandle{color:var(--muted);margin-top:5px}
.profileStats{display:flex;justify-content:center;gap:45px;margin:22px 0}
.stat strong{display:block;font-size:19px}.stat span{color:var(--muted);font-size:12px}
.profileButtons{display:flex;justify-content:center;gap:10px}
.profileBtn{padding:11px 20px;border-radius:13px;background:var(--card2);font-weight:700}

/* BALANCE */
.balance{padding:20px;background:radial-gradient(circle at 100% 0%,rgba(139,92,246,.28),transparent 42%),linear-gradient(135deg,#21153d,#171923);border:1px solid rgba(139,92,246,.18);border-radius:22px;margin-bottom:16px}
.balanceTop{display:flex;align-items:center;justify-content:space-between}
.balanceTitle{display:flex;align-items:center;gap:11px}
.walletIcon{width:43px;height:43px;border-radius:14px;background:rgba(139,92,246,.16);display:flex;align-items:center;justify-content:center}
.walletIcon svg{width:22px;height:22px;color:#b99aff}
.balance small{color:var(--muted);font-size:12px}
.balanceLabel{font-size:14px;font-weight:700}
.balanceAmount{font-size:30px;font-weight:800;margin-top:17px}
.balanceLine{height:1px;background:rgba(255,255,255,.08);margin:18px 0}
.balanceActions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.balanceAction{height:43px;border-radius:13px;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:13px}
.balanceAction svg{width:18px;height:18px}

/* RECORDS */
.recordsCard{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;margin-bottom:20px}
.recordsHeader{padding:17px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.recordsHeader h3{font-size:16px}.recordsHeader span{color:var(--muted);font-size:12px}
.record{min-height:67px;padding:12px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.record:last-child{border-bottom:0}
.recordIcon{width:40px;height:40px;border-radius:13px;background:var(--card2);display:flex;align-items:center;justify-content:center}
.recordIcon svg{width:19px;height:19px}
.recordInfo{flex:1}.recordTitle{font-size:13px;font-weight:700}.recordDate{color:var(--muted);font-size:11px;margin-top:4px}
.recordAmount{font-size:13px;font-weight:800}.recordAmount.positive{color:#5ee7a1}.recordAmount.neutral{color:#aaaebb}

/* SETTINGS */
.settingCard{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.settingRow{min-height:60px;padding:15px 17px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.settingRow:last-child{border-bottom:0}
.settingLeft{display:flex;align-items:center;gap:13px}
.settingIcon{width:38px;height:38px;border-radius:12px;background:var(--card2);display:flex;align-items:center;justify-content:center}
.settingIcon svg{width:19px;height:19px}
.toggle{width:50px;height:29px;border-radius:20px;background:#383b48;padding:3px}
.toggleCircle{width:23px;height:23px;border-radius:50%;background:white;transition:.2s}
.toggle.on{background:var(--accent)}.toggle.on .toggleCircle{transform:translateX(21px)}

/* MODERN CHAT LIST */
.chatList{display:flex;flex-direction:column;gap:10px}
.chatFriend{
background:var(--card);
border:1px solid var(--line);
border-radius:20px;
padding:13px;
display:flex;
align-items:center;
gap:12px;
cursor:pointer;
transition:.15s;
}
.chatFriend:active{transform:scale(.98)}
.chatAvatar{
width:50px;
height:50px;
border-radius:50%;
background:linear-gradient(135deg,#8b5cf6,#ec4899);
display:flex;
align-items:center;
justify-content:center;
font-weight:800;
font-size:18px;
position:relative;
flex-shrink:0;
}
.chatOnline{
position:absolute;
right:-1px;
bottom:0;
width:15px;
height:15px;
border-radius:50%;
background:#2bd66f;
border:3px solid var(--card);
box-shadow:0 0 0 2px rgba(43,214,111,.12);
}
.chatInfo{flex:1;min-width:0}
.chatName{font-size:15px;font-weight:800}
.chatStatus{font-size:12px;color:#2bd66f;margin-top:4px}
.chatPreview{font-size:12px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chatTime{font-size:10px;color:var(--muted)}
.chatArrow{width:35px;height:35px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center}
.chatArrow svg{width:17px;height:17px}

/* INBOX */
#inbox{
display:none;
position:fixed;
inset:0;
z-index:5000;
background:var(--bg);
}
.inbox.active{display:flex;flex-direction:column}
.inboxHeader{
height:68px;
display:flex;
align-items:center;
gap:10px;
padding:0 12px;
background:rgba(8,9,13,.94);
backdrop-filter:blur(18px);
border-bottom:1px solid var(--line);
flex-shrink:0;
}
.inboxBack{
width:40px;
height:40px;
border-radius:50%;
background:var(--card2);
display:flex;
align-items:center;
justify-content:center;
}
.inboxBack svg{width:21px}
.inboxUser{
display:flex;
align-items:center;
gap:10px;
flex:1;
min-width:0;
}
.inboxAvatar{
width:40px;
height:40px;
border-radius:50%;
background:linear-gradient(135deg,#8b5cf6,#ec4899);
display:flex;
align-items:center;
justify-content:center;
font-weight:800;
position:relative;
}
.inboxOnline{
position:absolute;
right:-1px;
bottom:-1px;
width:12px;
height:12px;
border-radius:50%;
background:#2bd66f;
border:2px solid var(--bg);
}
.inboxName{font-size:14px;font-weight:800}
.inboxStatus{font-size:11px;color:#2bd66f;margin-top:2px}
.inboxHeaderActions{display:flex;gap:7px}
.inboxHeaderBtn{
width:38px;
height:38px;
border-radius:50%;
background:var(--card2);
display:flex;
align-items:center;
justify-content:center;
}
.inboxHeaderBtn svg{width:19px;height:19px}

/* MESSAGES AREA */
.messagesArea{
flex:1;
overflow-y:auto;
padding:18px 14px 10px;
display:flex;
flex-direction:column;
gap:9px;
}
.messageRow{display:flex}
.messageRow.me{justify-content:flex-end}
.message{
max-width:76%;
padding:10px 13px;
border-radius:18px;
font-size:14px;
line-height:1.4;
}
.message.friend{
background:var(--card2);
border-bottom-left-radius:5px;
}
.message.me{
background:linear-gradient(135deg,#8b5cf6,#ec4899);
border-bottom-right-radius:5px;
}
.messageTime{
font-size:9px;
color:var(--muted);
margin-top:3px;
padding:0 5px;
}
.messageRow.me .messageTime{text-align:right}

/* VOICE MESSAGE BUBBLE */
.voiceBubble{
display:flex;
align-items:center;
gap:10px;
min-width:165px;
}
.voicePlay{
width:32px;
height:32px;
border-radius:50%;
background:rgba(255,255,255,.18);
display:flex;
align-items:center;
justify-content:center;
}
.voicePlay svg{width:15px;height:15px;fill:currentColor}
.voiceWave{
height:25px;
display:flex;
align-items:center;
gap:2px;
}
.voiceWave span{
width:3px;
border-radius:4px;
background:currentColor;
opacity:.85;
}
.voiceDuration{font-size:11px;opacity:.85}

/* CHAT COMPOSER */
.chatComposer{
padding:9px 10px calc(10px + env(safe-area-inset-bottom));
background:var(--bg);
border-top:1px solid var(--line);
display:flex;
align-items:flex-end;
gap:7px;
}
.composerBtn{
width:43px;
height:43px;
border-radius:50%;
background:var(--card2);
display:flex;
align-items:center;
justify-content:center;
flex-shrink:0;
}
.composerBtn svg{width:21px;height:21px}
.messageInput{
flex:1;
min-height:43px;
max-height:110px;
border:1px solid var(--line);
outline:none;
border-radius:22px;
padding:11px 15px;
background:var(--card);
color:var(--text);
font-family:inherit;
font-size:14px;
resize:none;
}
.sendBtn{
width:43px;
height:43px;
border-radius:50%;
background:linear-gradient(135deg,#8b5cf6,#ec4899);
display:flex;
align-items:center;
justify-content:center;
flex-shrink:0;
}
.sendBtn svg{width:20px;height:20px}

/* STICKERS */
.stickerPanel{
display:none;
padding:12px;
background:var(--card);
border-top:1px solid var(--line);
grid-template-columns:repeat(5,1fr);
gap:9px;
max-height:190px;
overflow-y:auto;
}
.stickerPanel.show{display:grid}
.sticker{
height:48px;
border-radius:14px;
background:var(--card2);
display:flex;
align-items:center;
justify-content:center;
font-size:26px;
cursor:pointer;
}
.sticker:active{transform:scale(.9)}

/* VOICE RECORDING */
.voiceRecording{
display:none;
flex:1;
height:43px;
align-items:center;
gap:10px;
padding:0 13px;
background:var(--card);
border:1px solid #ff3d68;
border-radius:22px;
}
.voiceRecording.show{display:flex}
.recordPulse{
width:9px;
height:9px;
border-radius:50%;
background:#ff3d68;
animation:pulse 1s infinite;
}
@keyframes pulse{50%{opacity:.3;transform:scale(.75)}}
.recordText{font-size:12px;color:#ff718b;flex:1}
.cancelRecord{
width:30px;
height:30px;
border-radius:50%;
background:var(--card2);
display:flex;
align-items:center;
justify-content:center;
}
.cancelRecord svg{width:16px}

/* CALL SCREEN */
.callScreen{
display:none;
position:fixed;
inset:0;
z-index:9000;
background:radial-gradient(circle at 50% 25%,#33205d,#10111a 55%,#08090d);
align-items:center;
justify-content:center;
flex-direction:column;
}
.callScreen.show{display:flex}
.callAvatar{
width:105px;
height:105px;
border-radius:50%;
background:linear-gradient(135deg,#ff4ecd,#8b5cf6,#18c8ff);
display:flex;
align-items:center;
justify-content:center;
font-size:42px;
font-weight:900;
box-shadow:0 20px 60px rgba(139,92,246,.35);
}
.callName{font-size:25px;font-weight:800;margin-top:20px}
.callStatus{color:#a9adbb;font-size:13px;margin-top:8px}
.callControls{display:flex;gap:15px;margin-top:55px}
.callControl{
width:58px;
height:58px;
border-radius:50%;
background:rgba(255,255,255,.1);
display:flex;
align-items:center;
justify-content:center;
backdrop-filter:blur(10px);
}
.callControl svg{width:23px;height:23px}
.callControl.end{background:#ff3d68}
.callControl.end svg{transform:rotate(135deg)}

/* =========================================================
   NEW LIVE ROOM
========================================================= */
.liveRoom{
position:fixed;
inset:0;
z-index:8000;
background:#000;
display:none;
overflow:hidden;
}
.liveRoom.open{display:block}

#liveVideo{
position:absolute;
inset:0;
width:100%;
height:100%;
object-fit:cover;
background:#090a0f;
}

.liveShade{
position:absolute;
inset:0;
background:
linear-gradient(to bottom,rgba(0,0,0,.65),transparent 25%),
linear-gradient(to top,rgba(0,0,0,.8),transparent 42%);
pointer-events:none;
}

.liveTopBar{
position:absolute;
top:0;
left:0;
right:0;
height:75px;
padding:14px;
padding-top:calc(14px + env(safe-area-inset-top));
display:flex;
align-items:center;
gap:8px;
z-index:3;
}

.liveRoomBadge{
height:32px;
padding:0 10px;
border-radius:10px;
background:#ff304f;
display:flex;
align-items:center;
gap:6px;
font-size:11px;
font-weight:900;
}
.liveRoomBadge span{
width:7px;
