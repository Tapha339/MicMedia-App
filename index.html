<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MicMedia</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    body {
      background: #f2f3f5;
      color: #111;
    }
    .app {
      max-width: 500px;
      margin: auto;
      min-height: 100vh;
      background: white;
    }
    header {
      background: #111;
      color: white;
      padding: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .logo {
      font-size: 25px;
      font-weight: bold;
    }
    .live-button {
      background: #e53935;
      color: white;
      border: none;
      border-radius: 20px;
      padding: 9px 14px;
      font-weight: bold;
      cursor: pointer;
    }
    .stories {
      display: flex;
      gap: 12px;
      padding: 15px;
      overflow-x: auto;
      border-bottom: 1px solid #ddd;
    }
    .story {
      min-width: 70px;
      text-align: center;
      font-size: 12px;
    }
    .story-circle {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff004c, #ffb300);
      padding: 3px;
      margin: auto auto 5px;
    }
    .story-inner {
      background: #222;
      color: white;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }
    .feed {
      padding-bottom: 70px;
    }
    .post {
      border-bottom: 8px solid #f2f3f5;
      padding: 15px;
    }
    .post-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .avatar {
      width: 42px;
      height: 42px;
      background: #222;
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }
    .post-image {
      height: 240px;
      background: linear-gradient(135deg, #222, #555);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 30px;
      margin: 12px 0;
    }
    .actions {
      display: flex;
      gap: 20px;
      margin-top: 12px;
    }
    .actions button {
      border: none;
      background: none;
      font-size: 15px;
      cursor: pointer;
    }
    nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      max-width: 500px;
      width: 100%;
      background: white;
      border-top: 1px solid #ddd;
      display: flex;
      justify-content: space-around;
      padding: 12px 5px;
      z-index: 20;
    }
    nav button {
      border: none;
      background: none;
      font-size: 12px;
      cursor: pointer;
    }
    /* LIVE SCREEN */
    #liveScreen {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
      color: white;
      z-index: 100;
      max-width: 500px;
      margin: auto;
    }
    .camera-area {
      height: 100vh;
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #111, #333);
    }
    #cameraVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }
    .camera-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
      color: #ccc;
    }
    .live-top {
      position: absolute;
      top: 20px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 5;
    }
    .live-label {
      background: #e53935;
      padding: 8px 13px;
      border-radius: 7px;
      font-weight: bold;
    }
    .viewers {
      background: rgba(0,0,0,.6);
      padding: 8px 13px;
      border-radius: 20px;
    }
    .close-live {
      background: rgba(0,0,0,.7);
      color: white;
      border: none;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
    }
    .comments {
      position: absolute;
      left: 15px;
      right: 15px;
      bottom: 120px;
      max-height: 230px;
      overflow-y: auto;
      z-index: 5;
    }
    .comment {
      margin-top: 8px;
      background: rgba(0,0,0,.55);
      display: table;
      padding: 7px 10px;
      border-radius: 15px;
      font-size: 14px;
    }
    .live-bottom {
      position: absolute;
      bottom: 20px;
      left: 15px;
      right: 15px;
      display: flex;
      gap: 8px;
      z-index: 5;
    }
    .comment-input {
      flex: 1;
      border: none;
      border-radius: 25px;
      padding: 12px;
      outline: none;
    }
    .control {
      width: 45px;
      height: 45px;
      border: none;
      border-radius: 50%;
      background: rgba(255,255,255,.9);
      cursor: pointer;
      font-size: 18px;
    }
    .end-live {
      background: #e53935;
      color: white;
      border: none;
      border-radius: 25px;
      padding: 0 15px;
      font-weight: bold;
      cursor: pointer;
    }
    .reaction {
      position: absolute;
      right: 25px;
      bottom: 140px;
      font-size: 30px;
      animation: floatUp 2s ease-out forwards;
      z-index: 10;
    }
    @keyframes floatUp {
      from {
        transform: translateY(0);
        opacity: 1;
      }
      to {
        transform: translateY(-180px);
        opacity: 0;
      }
    }
    .live-info {
      text-align: center;
      padding: 20px;
    }
    .live-info h2 {
      margin-bottom: 10px;
    }
    .go-live-big {
      background: #e53935;
      color: white;
      border: none;
      border-radius: 25px;
      padding: 14px 25px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
    }
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">MicMedia</div>
    <button class="live-button" onclick="startLive()">🔴 Go Live</button>
  </header>
  <div class="stories">
    <div class="story">
      <div class="story-circle">
        <div class="story-inner">You</div>
      </div>
      Your Story
    </div>
    <div class="story">
      <div class="story-circle">
        <div class="story-inner">F</div>
      </div>
      Friend
    </div>
    <div class="story">
      <div class="story-circle">
        <div class="story-inner">F2</div>
      </div>
      Friend 2
    </div>
    <div class="story">
      <div class="story-circle">
        <div class="story-inner">G</div>
      </div>
      Groups
    </div>
  </div>
  <main class="feed">
    <div class="post">
      <div class="post-header">
        <div class="avatar">M</div>
        <div>
          <strong>MicMedia</strong>
          <p style="font-size:12px;color:#777;">Today</p>
        </div>
      </div>
      <p>Welcome to MicMedia! 🖤</p>
      <div class="post-image">
        🎬 MicMedia
      </div>
      <div class="actions">
        <button onclick="likePost(this)">❤️ Like <span>0</span></button>
        <button onclick="alert('Comments coming soon!')">💬 Comment</button>
        <button onclick="sharePost()">↗️ Share</button>
      </div>
    </div>
    <div class="post">
      <div class="post-header">
        <div class="avatar">F</div>
        <div>
          <strong>Friend</strong>
          <p style="font-size:12px;color:#777;">1h ago</p>
        </div>
      </div>
      <p>Enjoying MicMedia today! 🔥</p>
      <div class="actions">
        <button onclick="likePost(this)">❤️ Like <span>0</span></button>
        <button onclick="alert('Comments coming soon!')">💬 Comment</button>
        <button onclick="sharePost()">↗️ Share</button>
      </div>
    </div>
  </main>
  <nav>
    <button onclick="showHome()">🏠<br>Home</button>
    <button onclick="alert('Search coming soon!')">🔍<br>Search</button>
    <button onclick="startLive()">🔴<br>Live</button>
    <button onclick="alert('Messages coming soon!')">💬<br>Messages</button>
    <button onclick="alert('Profile coming soon!')">👤<br>Profile</button>
  </nav>
</div>
<!-- LIVE STREAM SCREEN -->
<div id="liveScreen">
  <div class="camera-area">
    <video id="cameraVideo" autoplay playsinline></video>
    <div id="cameraPlaceholder" class="camera-placeholder">
      <div>
        <h2>🎥 MicMedia Live</h2>
        <p>Starting your livestream...</p>
      </div>
    </div>
    <div class="live-top">
      <div class="live-label">🔴 LIVE</div>
      <div class="viewers">
        👥 <span id="viewerCount">1</span>
      </div>
      <button class="close-live" onclick="endLive()">✕</button>
    </div>
    <div id="comments" class="comments">
      <div class="comment"><strong>Friend:</strong> 🔥🔥🔥</div>
      <div class="comment"><strong>Friend 2:</strong> Nice live!</div>
    </div>
    <div class="live-bottom">
      <input
        id="commentInput"
        class="comment-input"
        type="text"
        placeholder="Comment..."
        onkeydown="sendComment(event)"
      >
      <button class="control" onclick="toggleMic()" id="micButton">
        🎤
      </button>
      <button class="control" onclick="switchCamera()">
        🔄
      </button>
      <button class="control" onclick="sendReaction()">
        ❤️
      </button>
      <button class="end-live" onclick="endLive()">
        End
      </button>
    </div>
  </div>
</div>
<script>
  let liveStream = null;
  let micEnabled = true;
  let currentCamera = "user";
  let viewerCount = 1;
  function startLive() {
    const liveScreen = document.getElementById("liveScreen");
    liveScreen.style.display = "block";
    viewerCount = Math.floor(Math.random() * 20) + 1;
    document.getElementById("viewerCount").textContent = viewerCount;
    startCamera();
  }
  async function startCamera() {
    const video = document.getElementById("cameraVideo");
    const placeholder = document.getElementById("cameraPlaceholder");
    try {
      if (liveStream) {
        liveStream.getTracks().forEach(track => track.stop());
      }
      liveStream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: currentCamera
        },
        audio: true
      });
      video.srcObject = liveStream;
      video.style.display = "block";
      placeholder.style.display = "none";
    } catch (error) {
      video.style.display = "none";
      placeholder.style.display = "flex";
      placeholder.innerHTML = `
        <div>
          <h2>🎥 Camera permission needed</h2>
          <p>Please allow MicMedia to access your camera and microphone.</p>
        </div>
      `;
    }
  }
  function toggleMic() {
    if (!liveStream) return;
    const audioTracks = liveStream.getAudioTracks();
    audioTracks.forEach(track => {
      track.enabled = !track.enabled;
      micEnabled = track.enabled;
    });
    document.getElementById("micButton").textContent =
      micEnabled ? "🎤" : "🔇";
  }
  async function switchCamera() {
    currentCamera =
      currentCamera === "user" ? "environment" : "user";
    await startCamera();
  }
  function sendReaction() {
    const reaction = document.createElement("div");
    reaction.className = "reaction";
    reaction.textContent = "❤️";
    document.getElementById("liveScreen").appendChild(reaction);
    setTimeout(() => {
      reaction.remove();
    }, 2000);
  }
  function sendComment(event) {
    if (event.key !== "Enter") return;
    const input = document.getElementById("commentInput");
    const text = input.value.trim();
    if (!text) return;
    const comment = document.createElement("div");
    comment.className = "comment";
    comment.innerHTML = "<strong>You:</strong> " + escapeHTML(text);
    document.getElementById("comments").appendChild(comment);
    input.value = "";
    const comments = document.getElementById("comments");
    comments.scrollTop = comments.scrollHeight;
  }
  function escapeHTML(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
  }
  function endLive() {
    if (liveStream) {
      liveStream.getTracks().forEach(track => track.stop());
      liveStream = null;
    }
    document.getElementById("cameraVideo").srcObject = null;
    document.getElementById("liveScreen").style.display = "none";
  }
  function likePost(button) {
    const number = button.querySelector("span");
    let count = parseInt(number.textContent);
    count++;
    number.textContent = count;
  }
  function sharePost() {
    if (navigator.share) {
      navigator.share({
        title: "MicMedia",
        text: "Check out MicMedia!"
      });
    } else {
      alert("MicMedia link can be shared here.");
    }
  }
  function showHome() {
    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  }
</script>
</body>
</html>
